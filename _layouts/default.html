<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title }} · gimme</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Silkscreen&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root { --ink: #111; --muted: #666; --line: #e3e3de; --snow: #F4F4F1; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--snow); color: var(--ink);
           font: 15px/1.65 "Space Mono", ui-monospace, monospace; }
    main { max-width: 720px; margin: 0 auto; padding: 32px 16px 64px; }
    .brand { font-family: "Silkscreen", monospace; font-size: 28px; text-decoration: none; color: var(--ink); }
    nav { display: flex; gap: 16px; align-items: baseline; margin-bottom: 32px; }
    nav a:not(.brand) { color: var(--muted); }
    h1, h2, h3 { font-family: "Silkscreen", monospace; font-weight: 400; line-height: 1.25; }
    h1 { font-size: 26px; margin: 0 0 4px; }
    h2 { font-size: 19px; margin: 36px 0 8px; }
    h3 { font-size: 15px; margin: 24px 0 4px; }
    a { color: var(--ink); }
    .table-wrap { overflow-x: auto; }
    table { border-collapse: collapse; width: 100%; font-size: 13px; }
    th, td { text-align: left; vertical-align: top; padding: 8px; border-bottom: 1px solid var(--line); }
    ul { padding-left: 20px; }
  </style>
</head>
<body>
  <main>
    <nav>
      <a class="brand" href="{{ '/' | relative_url }}">gimme</a>
      <a href="{{ '/privacy/' | relative_url }}">Privacy</a>
      <a href="{{ '/terms/' | relative_url }}">Terms</a>
    </nav>
    {{ content | replace: '<table>', '<div class="table-wrap"><table>' | replace: '</table>', '</table></div>' }}
  </main>
</body>
</html>
